[package]
name = "rebackup"
version = "0.0.0"
description = "Selectively back up critical data before a Windows clean install"
authors = ["rebackup contributors"]
license = "MIT"
repository = "https://github.com/Aryansingh0783/rebackup"
# NOTE: edition 2021 (not 2024) is deliberate — see README "Deviations from spec".
# 2024 requires rustc >= 1.85 and buys us nothing this crate actually uses.
edition = "2021"
rust-version = "1.82"

[lib]
name = "rebackup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
parking_lot = "0.12"
rayon = "1.10"

# ---- filesystem / discovery -------------------------------------------------
walkdir = "2.5"
ignore = "0.4"
globset = "0.4"
regex = "1.11"
dirs = "5"
sysinfo = { version = "0.32", default-features = false, features = ["disk", "system"] }

# ---- integrity / crypto -----------------------------------------------------
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
aes-gcm = { version = "0.10", features = ["std"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"

# ---- archiving --------------------------------------------------------------
zip = { version = "2.2", default-features = false, features = ["deflate", "zstd", "time"] }

# ---- misc -------------------------------------------------------------------
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sevenz-rust2 = { version = "0.10.0", features = ["compress", "aes256"], optional = true }

[target.'cfg(windows)'.dependencies]
# rusqlite reads Chromium `Login Data` / `Web Data`. `bundled` avoids a system
# SQLite dependency and pins the amalgamation we test against.
rusqlite = { version = "0.32", features = ["bundled"] }
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[features]
default = ["sevenz"]
# 7z/LZMA2 + AES-256 archive output. Disable for a smaller build that uses zip+zstd.
sevenz = []
# Enables the raw-MFT fast path. Off => always use the walkdir fallback.
mft = []
sevenz-rust2 = ["dep:sevenz-rust2"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
