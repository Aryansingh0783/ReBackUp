# Static site — no build step, so nothing can break in CI that didn't break locally.
[build]
  publish = "site"
  command = ""

[[redirects]]
  from = "/github"
  to   = "https://github.com/Aryansingh0783/ReBackUp"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
